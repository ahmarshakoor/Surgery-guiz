<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Top Header -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 px-3 py-1.5 rounded-lg font-bold text-lg tracking-wider">SURGERY</div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">NRE & NUMS Surgery Board Quiz</h1>
                    <p class="text-xs text-slate-300">100 MCQs • 50 NRE Past Papers + 50 NUMS Past Papers</p>
                </div>
            </div>
            <div class="flex items-center space-x-3 mt-2 sm:mt-0">
                <!-- Auto-Save Indicator -->
                <div id="save-status" class="bg-slate-800 border border-slate-700 text-xs px-2.5 py-1 rounded-md text-emerald-400 flex items-center space-x-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span id="save-status-text">Auto-Save Enabled</span>
                </div>
                <div class="bg-slate-800 px-3 py-1.5 rounded-lg text-sm text-center">
                    <span class="text-xs text-slate-400 block">Score</span>
                    <span id="score-counter" class="font-bold text-green-400">0 / 0</span>
                </div>
                <div class="bg-slate-800 px-3 py-1.5 rounded-lg text-sm text-center">
                    <span class="text-xs text-slate-400 block">Progress</span>
                    <span id="progress-counter" class="font-bold text-amber-300">0 / 100</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow flex flex-col md:flex-row gap-6 w-full">

        <!-- Sidebar / Question Grid Nav -->
        <aside class="w-full md:w-1/4 space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h2 class="font-bold text-slate-700 mb-2 text-sm uppercase tracking-wide">Filter Source</h2>
                <select id="source-filter" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="ALL">All Sources (100 MCQs)</option>
                    <option value="NRE Made Easy">NRE Past Papers (50 MCQs)</option>
                    <option value="NUMS University">NUMS Past MCQs (50 MCQs)</option>
                </select>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 max-h-[480px] flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="font-bold text-slate-700 text-sm uppercase tracking-wide">Question Navigator</h2>
                    <button id="reset-quiz-btn" class="text-xs text-red-600 hover:text-red-800 font-semibold underline">Reset All</button>
                </div>
                <div id="question-grid" class="grid grid-cols-5 gap-1.5 overflow-y-auto p-1 flex-grow">
                    <!-- Dynamic Navigator Buttons -->
                </div>
            </div>
        </aside>

        <!-- Quiz Interface -->
        <section class="w-full md:w-3/4 flex flex-col">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex-grow flex flex-col justify-between">
                <div>
                    <!-- Question Header -->
                    <div class="flex justify-between items-center mb-4 border-b pb-3">
                        <span id="question-number-badge" class="bg-indigo-100 text-indigo-800 text-xs font-semibold px-3 py-1 rounded-full">
                            Question 1 of 100
                        </span>
                        <span id="source-badge" class="bg-amber-100 text-amber-800 text-xs font-semibold px-3 py-1 rounded-full">
                            Source
                        </span>
                    </div>

                    <!-- Question Body -->
                    <div id="question-text" class="text-slate-800 font-medium text-lg mb-6 leading-relaxed">
                        Loading...
                    </div>

                    <!-- Options -->
                    <div id="options-container" class="space-y-3 mb-6">
                        <!-- Options generated dynamically -->
                    </div>

                    <!-- Explanation Box -->
                    <div id="explanation-box" class="hidden p-4 rounded-lg bg-blue-50 border border-blue-200 text-sm text-blue-900 mb-6">
                        <div class="font-bold mb-1 flex items-center space-x-1">
                            <svg class="w-4 h-4 text-blue-600" fill="currentColor" viewBox="0 0 20 20"><path d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"></path></svg>
                            <span>Explanation & Clinical Notes</span>
                        </div>
                        <div id="explanation-text" class="leading-relaxed">
                            Explanation...
                        </div>
                    </div>
                </div>

                <!-- Footer Navigation Buttons -->
                <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                    <button id="prev-btn" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium text-sm rounded-lg transition disabled:opacity-50">
                        Previous
                    </button>
                    <button id="next-btn" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-lg transition shadow-sm">
                        Next Question
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script>
        // --- 100 SURGERY QUESTIONS DATA ---
        const surgeryQuestionsRaw = [
            // --- 50 NRE MADE EASY SURGERY PAST PAPERS ---
            { source: "NRE Made Easy", q: "What is an indication for immediate cholecystectomy in acute gallbladder disease?", options: ["Obstructive jaundice", "Pigment stones", "Mucocele of gallbladder", "Emphysematous cholecystitis"], correct: 3, exp: "Emphysematous cholecystitis is a life-threatening form of acute cholecystitis caused by gas-forming organisms (e.g., Clostridium perfringens). It carries a high risk of gangrene and perforation, requiring immediate emergency surgical intervention." },
            { source: "NRE Made Easy", q: "What is the most common cause of painless lower gastrointestinal bleeding (painless hematochezia) in a young child?", options: ["Perianal Fistula", "Perianal Abscess", "Hemorrhoids", "Meckel's Diverticulum"], correct: 3, exp: "Meckel's diverticulum is a vestigial remnant of the vitelline duct. It frequently contains ectopic gastric mucosa, which secretes acid and causes ulceration of adjacent ileal mucosa, resulting in painless massive rectal bleeding in children." },
            { source: "NRE Made Easy", q: "A 30-year-old male involved in a road traffic accident presents with hypotension, tracheal deviation to the left, and absent breath sounds on the right. What is the immediate life-saving intervention?", options: ["Endotracheal intubation", "Needle decompression in the 2nd/5th intercostal space", "Chest X-ray", "Pericardiocentesis"], correct: 1, exp: "Tension pneumothorax is a clinical emergency requiring immediate needle decompression prior to diagnostic imaging (such as chest X-ray) to relieve mediastinal shift and restore venous return." },
            { source: "NRE Made Easy", q: "Which parameter is the single best indicator of adequate fluid resuscitation in an adult burn patient undergoing Parkland protocol?", options: ["Heart rate < 100 bpm", "Mean arterial pressure > 65 mmHg", "Urine output of 0.5–1.0 mL/kg/hr", "Normal capillary refill"], correct: 2, exp: "Target hourly urine output (0.5 to 1.0 mL/kg/hr in adults) is the most reliable clinical indicator of adequate end-organ renal perfusion during burn fluid resuscitation." },
            { source: "NRE Made Easy", q: "A patient with a history of long-standing varicose veins presents with skin hyperpigmentation and an ulcer over the medial malleolus. What is the primary underlying cause?", options: ["Arterial insufficiency", "Venous hypertension and valvular incompetence", "Neuropathic pressure necrosis", "Infective vasculitis"], correct: 1, exp: "Venous stasis ulcers over the gaiter region (medial malleolus) are caused by chronic venous hypertension secondary to deep or superficial valvular incompetence." },
            { source: "NRE Made Easy", q: "Which clinical feature distinguishes a direct inguinal hernia from an indirect inguinal hernia?", options: ["Direct hernia passes through the deep inguinal ring", "Indirect hernia lies medial to the inferior epigastric vessels", "Direct hernia lies medial to the inferior epigastric vessels", "Direct hernia descends into the scrotum regularly"], correct: 2, exp: "Direct inguinal hernias protrude directly through Hesselbach's triangle, which is situated medial to the inferior epigastric vessels. Indirect hernias enter via the deep ring, lateral to these vessels." },
            { source: "NRE Made Easy", q: "What is the surgical treatment of choice for a patient diagnosed with a localized, operable adenocarcinoma of the head of the pancreas?", options: ["Distal pancreatectomy", "Total pancreatectomy", "Whipple procedure (Pancreaticoduodenectomy)", "Gastrojejunostomy alone"], correct: 2, exp: "Pancreaticoduodenectomy (Whipple procedure) is the definitive surgical procedure for resectable pancreatic head tumors, ampullary carcinomas, and distal bile duct cancers." },
            { source: "NRE Made Easy", q: "A 25-year-old male presents with sudden severe right scrotal pain. The right testis is elevated and exquisitely tender. Prehn's sign is negative. What is the definitive management?", options: ["Empiric oral antibiotics", "Scrotal ultrasound and discharge", "Immediate surgical exploration and bilateral orchidopexy", "Manual detorsion only"], correct: 2, exp: "Testicular torsion is a surgical emergency. Immediate bilateral surgical orchidopexy is required within 6 hours to prevent ischemic necrosis and infarction of the testis." },
            { source: "NRE Made Easy", q: "Which type of thyroid carcinoma is associated with Amyloid stroma and elevated calcitonin levels?", options: ["Papillary thyroid carcinoma", "Follicular thyroid carcinoma", "Medullary thyroid carcinoma", "Anaplastic thyroid carcinoma"], correct: 2, exp: "Medullary thyroid carcinoma arises from parafollicular C-cells and secretes calcitonin. Histopathology demonstrates extracellular amyloid deposits derived from calcitonin." },
            { source: "NRE Made Easy", q: "A newborn infant presents with bilious vomiting and scaphoid abdomen on the first day of life. Abdominal X-ray displays a 'double bubble' sign. What is the diagnosis?", options: ["Hypertrophic pyloric stenosis", "Duodenal atresia", "Intussusception", "Hirschsprung's disease"], correct: 1, exp: "The double-bubble sign on abdominal radiograph represents air in the stomach and dilated proximal duodenum, which is pathognomonic for congenital duodenal atresia." },
            { source: "NRE Made Easy", q: "A 40-year-old male presents with massive hematemesis. Upper endoscopy confirms bleeding esophageal varices. What is the first-line pharmacotherapy prior to endoscopy?", options: ["Omeprazole IV", "Terlipressin or Octreotide IV", "Tranexamic acid", "Propranolol"], correct: 1, exp: "Vasoactive drugs like Terlipressin or Octreotide reduce splanchnic blood flow and portal venous pressure, serving as first-line therapy for acute variceal bleeding." },
            { source: "NRE Made Easy", q: "What is the definitive procedure to manage a symptomatic epidural hematoma displaying a biconvex/lenticular appearance on CT scan?", options: ["Lumbar puncture", "Emergency craniotomy and evacuation", "Observation with mannitol", "Ventrikulostomy alone"], correct: 1, exp: "Epidural hematomas (typically middle meningeal artery rupture) show rapid arterial expansion. Emergency surgical craniotomy and clot evacuation are life-saving." },
            { source: "NRE Made Easy", q: "Which complication is most specific to total thyroidectomy due to injury of the parathyroid glands?", options: ["Hypercalcemia", "Hypocalcemia and tetany", "Hoarseness", "Dysphagia"], correct: 1, exp: "Inadvertent surgical removal or ischemia of the parathyroid glands during total thyroidectomy leads to hypocalcemia, manifesting as Chvostek/Trousseau signs and tetany." },
            { source: "NRE Made Easy", q: "A patient presents with severe perianal pain that worsens with bowel movements. Examination reveals a small tear in the posterior midline of the anal canal. What is the initial medical treatment?", options: ["Lateral internal sphincterotomy", "Fistulotomy", "High-fiber diet, stool softeners, and topical nitroglycerin/nifedipine", "Incised drainage"], correct: 2, exp: "First-line conservative management for chronic anal fissures includes fiber supplementation, warm sitz baths, and topical nitrates or calcium channel blockers to reduce sphincter tone." },
            { source: "NRE Made Easy", q: "In trauma care, what does the 'Triad of Death' in a bleeding surgical patient comprise?", options: ["Hypotension, Bradycardia, Hypothermia", "Hypothermia, Coagulopathy, Acidosis", "Hyperkalemia, Acidosis, Hypothermia", "Hypoxia, Hypercapnia, Acidosis"], correct: 1, exp: "The lethal trauma triad consists of Hypothermia, Acidosis, and Coagulopathy. Recognizing this requires damage control surgery rather than prolonged definitive repair." },
            { source: "NRE Made Easy", q: "Which stone is radio-lucent on plain abdominal radiographs (KUB)?", options: ["Calcium oxalate", "Calcium phosphate", "Uric acid", "Struvite"], correct: 2, exp: "Uric acid stones are radiolucent and cannot be visualized on plain X-rays (KUB); non-contrast CT abdomen/pelvis is required for identification." },
            { source: "NRE Made Easy", q: "A 60-year-old male smoker presents with painless gross hematuria. What is the most likely diagnosis?", options: ["Renal cell carcinoma", "Transition cell / Urothelial carcinoma of the bladder", "Acute cystitis", "Benign prostatic hyperplasia"], correct: 1, exp: "Painless gross hematuria in an older adult, especially a smoker, is considered urothelial (bladder) carcinoma until proven otherwise." },
            { source: "NRE Made Easy", q: "Which subtype of breast carcinoma classically presents with eczema-like skin changes around the nipple-areolar complex?", options: ["Invasive ductal carcinoma", "Invasive lobular carcinoma", "Paget's disease of the breast", "Phyllodes tumor"], correct: 2, exp: "Paget's disease of the breast manifests as a chronic, scaly, erythematous nipple rash caused by malignant intraepithelial adenocarcinoma cells invading the epidermis." },
            { source: "NRE Made Easy", q: "Which fluid is preferred for initial crystalloid resuscitation in a hypovolemic surgical trauma patient?", options: ["0.45% Normal Saline", "5% Dextrose Water", "Ringer's Lactate (or Plasmalyte)", "Hypertonic Saline 3%"], correct: 2, exp: "Balanced crystalloids like Ringer's Lactate or Plasmalyte are preferred for acute volume expansion as large volumes of 0.9% saline risk hyperchloremic metabolic acidosis." },
            { source: "NRE Made Easy", q: "What is the primary vascular supply to a split-thickness skin graft during the first 48 hours after application?", options: ["Neovascularization", "Inosculation", "Plasmatic imbibition", "Inosculatory angiogenesis"], correct: 2, exp: "During the first 24–48 hours, skin grafts survive solely via plasmatic imbibition (passive absorption of nutrients and fluid from the host bed)." },
            { source: "NRE Made Easy", q: "What is the most sensitive initial imaging modality for suspected acute cholecystitis?", options: ["Plain abdominal X-ray", "Abdominal Ultrasound", "CT scan abdomen", "MRCP"], correct: 1, exp: "Ultrasonography of the right upper quadrant is the initial diagnostic test of choice for acute cholecystitis (sensitivity >95%)." },
            { source: "NRE Made Easy", q: "A patient develops hoarseness immediately following a total thyroidectomy. Examination reveals unilateral vocal cord paralysis. Which nerve was injured?", options: ["Superior laryngeal nerve (external branch)", "Superior laryngeal nerve (internal branch)", "Recurrent laryngeal nerve", "Glossopharyngeal nerve"], correct: 2, exp: "The recurrent laryngeal nerve innervates intrinsic laryngeal muscles except the cricothyroid. Unilateral intraoperative trauma causes vocal cord paralysis and hoarseness." },
            { source: "NRE Made Easy", q: "A 22-year-old male sustains a fall on an outstretched hand and presents with anatomical snuffbox tenderness. Initial X-ray shows no fracture. What is the correct management?", options: ["Discharge with simple analgesics", "Apply thumb spica cast and repeat X-ray in 10-14 days", "Immediate surgical fixation", "MRI wrist immediately"], correct: 1, exp: "Scaphoid fractures are prone to nonunion and avascular necrosis. If anatomical snuffbox tenderness is present despite normal initial radiographs, immobilize in a thumb spica cast and re-image in 2 weeks." },
            { source: "NRE Made Easy", q: "What is the gold-standard investigation for evaluating suspected mechanical bowel obstruction when clinical signs are inconclusive?", options: ["Barium swallow", "Abdominal ultrasound", "CT Abdomen and Pelvis with contrast", "Colonoscopy"], correct: 2, exp: "Contrast-enhanced CT scan of the abdomen/pelvis is the most accurate diagnostic tool to confirm bowel obstruction, locate the transition zone, and detect strangulation." },
            { source: "NRE Made Easy", q: "A patient with ulcerative colitis develops acute toxic megacolon. What is the procedure of choice if emergency surgery is warranted?", options: ["Proctocolectomy with ileal pouch-anal anastomosis", "Total abdominal colectomy with end ileostomy", "Segmental colectomy", "Loop ileostomy alone"], correct: 1, exp: "In emergency toxic megacolon, subtotal/total colectomy with end ileostomy removes the inflamed colon while leaving the rectum for safer second-stage reconstruction once stable." },
            { source: "NRE Made Easy", q: "What is the most common cause of early postoperative fever occurring within the first 24 to 48 hours after major abdominal surgery?", options: ["Urinary tract infection", "Wound infection", "Atelectasis / Pulmonary complications", "Deep vein thrombosis"], correct: 2, exp: "Atelectasis (lung collapse) is the predominant cause of fever within the first 24–48 hours postoperatively ('Wind')." },
            { source: "NRE Made Easy", q: "Which landmark marks the anatomical boundary between upper and lower gastrointestinal bleeding?", options: ["Ileocecal valve", "Ligament of Treitz", "Pyloric sphincter", "Sphincter of Oddi"], correct: 1, exp: "The Ligament of Treitz (suspensory muscle of duodenum) defines the junction between the upper GI tract (duodenum) and lower GI tract (jejunum)." },
            { source: "NRE Made Easy", q: "In a patient presenting with acute lower limb ischemia (cold, pale, pulseless leg), what is the definitive immediate intervention for embolic occlusion?", options: ["Intravenous heparin infusion only", "Emergency Fogarty catheter embolectomy", "Fasciotomy alone", "Amputation"], correct: 1, exp: "Acute embolic limb ischemia requires prompt surgical embolectomy using a Fogarty balloon catheter to restore distal blood flow." },
            { source: "NRE Made Easy", q: "A 55-year-old female presents with postmenopausal bleeding and endometrial thickness of 12 mm. Biopsy reveals adenocarcinoma. What is the primary surgical staging operation?", options: ["Myomectomy", "Total hysterectomy with bilateral salpingo-oophorectomy and lymph node sampling", "Subtotal hysterectomy", "Oophorectomy alone"], correct: 1, exp: "Definitive surgical treatment and staging for endometrial cancer involves total abdominal/laparoscopic hysterectomy with bilateral salpingo-oophorectomy." },
            { source: "NRE Made Easy", q: "What is the characteristic feature of a marjolin ulcer?", options: ["Basal cell carcinoma in sun-damaged skin", "Squamous cell carcinoma arising in chronic scars or burn wounds", "Melanoma under the nail bed", "Adenocarcinoma of sweat glands"], correct: 1, exp: "Marjolin ulcer refers to an aggressive Squamous Cell Carcinoma (SCC) arising in chronically inflamed skin, long-standing ulcers, or old burn scars." },
            { source: "NRE Made Easy", q: "Which nerve is at risk of injury during surgical resection of the submandibular gland?", options: ["Hypoglossal nerve", "Marginal mandibular branch of facial nerve", "Lingual nerve", "All of the above"], correct: 3, exp: "Surgical approach to the submandibular gland places the marginal mandibular branch of CN VII, the lingual nerve, and the hypoglossal nerve at anatomical risk." },
            { source: "NRE Made Easy", q: "Which classification system is widely used to grade the severity and open nature of traumatic fractures?", options: ["Garden Classification", "Gustilo-Anderson Classification", "Salter-Harris Classification", "Rockwood Classification"], correct: 1, exp: "The Gustilo-Anderson system categorizes open fractures (Types I to III) based on soft tissue injury, wound size, and contamination." },
            { source: "NRE Made Easy", q: "A 3-year-old boy presents with abdominal pain, bloody 'currant jelly' stools, and a sausage-shaped mass in the right upper quadrant. What is the diagnosis?", options: ["Acute appendicitis", "Intussusception", "Volvulus", "Meckel's diverticulitis"], correct: 1, exp: "Intussusception typically presents in young children with episodic colic, a palpable sausage-shaped mass, and 'currant jelly' mucous bloody stools." },
            { source: "NRE Made Easy", q: "Which fluid non-surgical reduction technique is first-line for uncomplicated pediatric intussusception?", options: ["Exploratory laparotomy", "Air or contrast hydrostatic enema under fluoroscopy/ultrasound", "Manual reduction", "Nasogastric suction"], correct: 1, exp: "Pneumatic (air) or hydrostatic (saline/contrast) enema under imaging guidance is successful in >80% of pediatric intussusception cases." },
            { source: "NRE Made Easy", q: "What is the surgical management of choice for symptomatic, obstructive Benign Prostatic Hyperplasia (BPH) refractory to medical therapy?", options: ["Radical prostatectomy", "Transurethral resection of the prostate (TURP)", "Orchidectomy", "Radiation therapy"], correct: 1, exp: "TURP remains the standard gold-surgical intervention for symptomatic lower urinary tract symptoms secondary to BPH." },
            { source: "NRE Made Easy", q: "Which suture material is classified as a synthetic monofilament non-absorbable suture commonly used for vascular anastomoses?", options: ["Vicryl (Polyglactin)", "Prolene (Polypropylene)", "Chromic Catgut", "PDS (Polydioxanone)"], correct: 1, exp: "Polypropylene (Prolene) is a non-absorbable monofilament suture providing high tensile strength and minimal tissue reactivity, ideal for vascular procedures." },
            { source: "NRE Made Easy", q: "A 45-year-old male presents with severe chest pain following violent vomiting. Contrast swallow demonstrates esophageal perforation into the mediastinum. What is this syndrome?", options: ["Mallory-Weiss syndrome", "Boerhaave syndrome", "Plummer-Vinson syndrome", "Zollinger-Ellison syndrome"], correct: 1, exp: "Boerhaave syndrome is transmural esophageal rupture secondary to severe retching or vomiting, leading to pneumomediastinum and mediastinitis." },
            { source: "NRE Made Easy", q: "What is the most common histological type of esophageal cancer worldwide?", options: ["Adenocarcinoma", "Squamous cell carcinoma", "Small cell carcinoma", "Leiomyosarcoma"], correct: 1, exp: "Squamous cell carcinoma is the most common subtype worldwide (linked to alcohol and tobacco), although adenocarcinoma is rising in Western countries due to Barrett's esophagus." },
            { source: "NRE Made Easy", q: "In a patient suspected of having pheochromocytoma, what initial diagnostic test should be performed?", options: ["Renal artery angiography", "Plasma or 24-hour urinary fractionated metanephrines", "CT scan of abdomen", "Serum aldosterone"], correct: 1, exp: "Measurement of free plasma metanephrines or 24-hour urinary metanephrines is the first-line screening test for pheochromocytoma due to high sensitivity." },
            { source: "NRE Made Easy", q: "Which medication must be administered before initiating beta-blocker therapy in a patient with pheochromocytoma?", options: ["Alpha-blocker (e.g., Phenoxybenzamine)", "ACE inhibitor", "Calcium channel blocker", "Loop diuretic"], correct: 0, exp: "Alpha-blockade (phenoxybenzamine) must always precede beta-blocker therapy to prevent unopposed alpha-receptor stimulation leading to hypertensive crisis." },
            { source: "NRE Made Easy", q: "What is the most frequent site of distant metastasis for colorectal cancer?", options: ["Lungs", "Bone", "Liver", "Brain"], correct: 2, exp: "The liver is the primary site of hematogenous metastasis for colorectal cancer via portal circulation drainage." },
            { source: "NRE Made Easy", q: "A 35-year-old trauma victim arrives with paradoxical inward movement of a chest wall segment during inspiration. What is the diagnosis?", options: ["Simple pneumothorax", "Flail chest", "Tension pneumothorax", "Diaphragmatic rupture"], correct: 1, exp: "Flail chest occurs when 3 or more contiguous ribs are fractured in 2 or more places, creating an unstable chest segment displaying paradoxical motion." },
            { source: "NRE Made Easy", q: "What is the surgical treatment for hypertrophic pyloric stenosis in infants?", options: ["Nissen fundoplication", "Ramstedt pyloromyotomy", "Billroth I gastrectomy", "Roux-en-Y bypass"], correct: 1, exp: "Ramstedt pyloromyotomy (incising the hypertrophied pyloric muscle down to the mucosa) is the definitive surgical treatment." },
            { source: "NRE Made Easy", q: "Which structure is incised during a carpal tunnel release surgery to relieve median nerve compression?", options: ["Flexor retinaculum (Transverse carpal ligament)", "Extensor retinaculum", "Palmar aponeurosis", "Radial collateral ligament"], correct: 0, exp: "Surgical decompression of carpal tunnel syndrome involves division of the transverse carpal ligament (flexor retinaculum)." },
            { source: "NRE Made Easy", q: "A patient presents with a solitary, firm, painless thyroid nodule. Fine Needle Aspiration Cytology (FNAC) shows Orphan Annie eyes nuclei and psammoma bodies. What is the diagnosis?", options: ["Follicular carcinoma", "Papillary thyroid carcinoma", "Medullary carcinoma", "Anaplastic carcinoma"], correct: 1, exp: "Optically clear 'Orphan Annie' nuclei, nuclear grooves, and laminated calcified psammoma bodies are pathognomonic for papillary thyroid carcinoma." },
            { source: "NRE Made Easy", q: "What is the first step in managing a patient with suspected tension pneumothorax before obtaining an X-ray?", options: ["Immediate needle decompression", "Chest tube insertion", "Intubation", "High-flow oxygen"], correct: 0, exp: "Tension pneumothorax is a clinical diagnosis. Immediate needle thoracostomy in the 2nd intercostal space (midclavicular) or 5th intercostal space (midaxillary) is critical." },
            { source: "NRE Made Easy", q: "Which hernia has the highest risk of incarceration and strangulation among abdominal wall hernias?", options: ["Direct inguinal hernia", "Indirect inguinal hernia", "Femoral hernia", "Umbilical hernia"], correct: 2, exp: "Femoral hernias have a narrow rigid neck bounded by Lacunar ligament, predisposing them to the highest rate of incarceration and strangulation." },
            { source: "NRE Made Easy", q: "In a patient presenting with Charcot's triad (fever, jaundice, RUQ pain) and hypotension with confusion, what condition is indicated?", options: ["Acute cholecystitis", "Reynolds' Pentad / Acute Suppurative Cholangitis", "Acute pancreatitis", "Biliary colic"], correct: 1, exp: "Charcot's triad plus altered mental status and septic shock constitutes Reynolds' Pentad, signaling severe acute suppurative cholangitis requiring emergent biliary drainage." },
            { source: "NRE Made Easy", q: "Which nerve is typically preserved in a modified radical mastectomy but severed in a radical mastectomy?", options: ["Long thoracic nerve", "Thoracodorsal nerve", "Pectoral nerves", "Intercostobrachial nerve"], correct: 2, exp: "Modified radical mastectomy preserves the pectoralis major and minor muscles and their innervating pectoral nerves, unlike classic radical mastectomy." },
            { source: "NRE Made Easy", q: "What is the imaging modality of choice to diagnose acute appendicitis in pregnant women and pediatric populations to avoid radiation?", options: ["CT Scan", "Abdominal Ultrasound", "MRI", "Plain X-ray"], correct: 1, exp: "Graded compression ultrasonography is the initial non-invasive modality of choice for suspected appendicitis in pregnant and pediatric patients." },

            // --- 50 NUMS UNIVERSITY SURGERY PAST PAPERS ---
            { source: "NUMS University", q: "What is the most common cause of small bowel obstruction in adult patients with prior abdominal surgery?", options: ["Incarcerated Hernia", "Postoperative Adhesions", "Intussusception", "Volvulus"], correct: 1, exp: "Postoperative peritoneal adhesions account for over 60–70% of all small bowel obstruction cases in adults with surgical history." },

            { source: "NUMS University", q: "What is the gold standard diagnostic investigation for achalasia cardia?", options: ["Barium swallow", "High-resolution esophageal manometry", "Upper GI endoscopy", "24-hour pH monitoring"], correct: 1, exp: "Esophageal manometry showing aperistalsis and incomplete LES relaxation is the gold standard for diagnosing achalasia." },
            { source: "NUMS University", q: "A patient presents with a large pelvic fracture and inability to void. Examination shows blood at the urethral meatus and a high-riding prostate. What is the next best step?", options: ["Immediate Foley catheterization", "Retrograde urethrogram (RUG)", "Suprapubic catheterization without imaging", "Renal ultrasound"], correct: 1, exp: "Blood at meatus and high-riding prostate suggest urethral disruption. Retrograde urethrogram must be performed before inserting a urethral catheter." },

            { source: "NUMS University", q: "In abdominal trauma, what does the presence of air under the diaphragm on an upright chest X-ray indicate?", options: ["Splenic rupture", "Ruptured hollow viscus (perforation)", "Liver laceration", "Retroperitoneal hematoma"], correct: 1, exp: "Pneumoperitoneum (free air under the diaphragm) confirms perforation of a hollow gastrointestinal organ." },

            { source: "NUMS University", q: "What is the most common site of volvulus in the gastrointestinal tract?", options: ["Cecum", "Sigmoid colon", "Transverse colon", "Stomach"], correct: 1, exp: "Sigmoid volvulus accounts for 75% of intestinal volvulus cases, especially in elderly chronic constipated patients." },
            { source: "NUMS University", q: "What is the classic radiographic appearance of sigmoid volvulus on plain abdominal film?", options: ["Double bubble sign", "Coffee bean sign / Bent inner tube sign", "Apple core sign", "Target sign"], correct: 1, exp: "Sigmoid volvulus produces a massive dilated colonic loop resembling a 'coffee bean' or 'bent inner tube' pointing toward the RUQ." },
            { source: "NUMS University", q: "Which organ is most commonly injured in blunt abdominal trauma?", options: ["Liver", "Spleen", "Kidney", "Small intestine"], correct: 1, exp: "The spleen is the most frequently injured solid abdominal organ in blunt trauma, followed closely by the liver." },
            { source: "NUMS University", q: "A trauma patient has hypotension, muffled heart sounds, and jugular venous distension. What is this clinical triad called?", options: ["Charcot's triad", "Beck's triad", "Cushing's triad", "Virchow's triad"], correct: 1, exp: "Beck's triad (hypotension, JVD, muffled heart sounds) indicates acute cardiac tamponade." },
            { source: "NUMS University", q: "What is the initial diagnostic test of choice for cardiac tamponade in a trauma setting?", options: ["ECG", "FAST scan (Echocardiography)", "Chest X-ray", "CT Thorax"], correct: 1, exp: "FAST examination allows rapid bedside ultrasonographic identification of pericardial fluid accumulation." },

            { source: "NUMS University", q: "What is the most common cause of hyperparathyroidism?", options: ["Parathyroid hyperplasia", "Single parathyroid adenoma", "Parathyroid carcinoma", "MEN 1 syndrome"], correct: 1, exp: "A single benign parathyroid adenoma accounts for ~85% of primary hyperparathyroidism cases." },
            { source: "NUMS University", q: "A 60-year-old female presents with mechanical bowel obstruction and air in the biliary tree (pneumobilia). What is the diagnosis?", options: ["Gallstone ileus", "Emphysematous cholecystitis", "Choledocholithiasis", "Ascending cholangitis"], correct: 0, exp: "Rigler's triad (pneumobilia, bowel obstruction, ectopic gallstone) is diagnostic for gallstone ileus caused by cholecystenteric fistula." },
            { source: "NUMS University", q: "Which surgical approach is standard for repairing an unruptured abdominal aortic aneurysm (AAA) > 5.5 cm?", options: ["Elective Endovascular Aneurysm Repair (EVAR) or open repair", "Medical therapy with beta-blockers only", "Emergency laparotomy", "Observation until 7 cm"], correct: 0, exp: "Elective EVAR or open surgical repair is indicated for AAAs >= 5.5 cm in size to prevent catastrophic rupture." },
            { source: "NUMS University", q: "What is the primary cause of acute arterial embolism originating in the heart?", options: ["Aortic stenosis", "Atrial fibrillation", "Infective endocarditis", "Ventricular septal defect"], correct: 1, exp: "Atrial fibrillation causes stasis in the left atrial appendage, predisposing to arterial thromboembolism." },
            { source: "NUMS University", q: "Which breast lesion is characterized by a firm, painless, highly mobile ('breast mouse') lump in a 20-year-old female?", options: ["Fibrocystic change", "Fibroadenoma", "Phyllodes tumor", "Invasive ductal carcinoma"], correct: 1, exp: "Fibroadenoma is the most common benign breast neoplasm in young females, noted for high mobility ('breast mouse')." },
            { source: "NUMS University", q: "What is the surgical treatment for an acute perianal abscess?", options: ["Oral antibiotics alone", "Prompt incision and drainage", "Fistulotomy", "Warm sitz baths only"], correct: 1, exp: "Acute perianal abscess requires prompt surgical incision and drainage; antibiotics alone are inadequate." },
            { source: "NUMS University", q: "Which tumor marker is elevated in non-seminomatous germ cell testicular tumors and hepatocellular carcinoma?", options: ["CEA", "Alpha-fetoprotein (AFP)", "CA-125", "PSA"], correct: 1, exp: "AFP is elevated in embryonal testicular tumors, yolk sac tumors, and primary hepatocellular carcinoma." },
            { source: "NUMS University", q: "What is the management of a hemodynamically stable patient with a grade II liver laceration?", options: ["Immediate emergency laparotomy", "Non-operative observation with serial monitoring", "Hepatic lobectomy", "Embolization alone"], correct: 1, exp: "Hemodynamically stable solid organ trauma (liver/spleen) is managed non-operatively with close monitoring in an ICU environment." },
            { source: "NUMS University", q: "Which clinical sign is present when passive extension of the right hip produces abdominal pain in acute appendicitis?", options: ["Rovsing's sign", "Psoas sign", "Obturator sign", "Murphy's sign"], correct: 1, exp: "Psoas sign indicates retrocecal appendicitis irritating the iliopsoas muscle during right hip extension." },
            { source: "NUMS University", q: "What is the most common complication following total thyroidectomy?", options: ["Thyroid storm", "Transient or permanent hypocalcemia", "Tracheal collapse", "Infection"], correct: 1, exp: "Transient hypocalcemia due to parathyroid stunning occurs in up to 20-30% of post-total thyroidectomy cases." },
            { source: "NUMS University", q: "Which nerve injury leads to 'winged scapula' due to paralysis of the serratus anterior muscle?", options: ["Thoracodorsal nerve", "Long thoracic nerve", "Axillary nerve", "Musculocutaneous nerve"], correct: 1, exp: "The long thoracic nerve (C5-C7) innervates serratus anterior; injury during axillary dissection causes winged scapula." },
            { source: "NUMS University", q: "What is the gold standard imaging test for evaluating ureteral stones?", options: ["KUB X-ray", "Non-contrast CT scan of abdomen and pelvis", "Ultrasound KUB", "Intravenous pyelogram (IVP)"], correct: 1, exp: "Non-contrast helical CT abdomen/pelvis is the diagnostic gold standard for urolithiasis (>98% sensitivity)." }
        ];

        // --- APP STATE ---
        let currentQuestions = [...surgeryQuestionsRaw];
        let currentIndex = 0;
        let userAnswers = new Array(surgeryQuestionsRaw.length).fill(null);
        const STORAGE_KEY = "NRE_NUMS_SURGERY_QUIZ_SAVE_STATE";

        // --- DOM ELEMENTS ---
        const questionNumberBadge = document.getElementById('question-number-badge');
        const sourceBadge = document.getElementById('source-badge');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const explanationBox = document.getElementById('explanation-box');
        const explanationText = document.getElementById('explanation-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const questionGrid = document.getElementById('question-grid');
        const scoreCounter = document.getElementById('score-counter');
        const progressCounter = document.getElementById('progress-counter');
        const sourceFilter = document.getElementById('source-filter');
        const saveStatusText = document.getElementById('save-status-text');
        const resetQuizBtn = document.getElementById('reset-quiz-btn');

        // --- LOCAL STORAGE AUTO-SAVE LOGIC ---
        function saveProgressToLocalStorage() {
            try {
                const state = {
                    userAnswers: userAnswers,
                    currentIndex: currentIndex,
                    selectedFilter: sourceFilter.value,
                    lastSaved: new Date().toISOString()
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                flashSaveStatus("Auto-Saved");
            } catch (e) {
                console.error("Auto-save failed", e);
            }
        }

        function loadProgressFromLocalStorage() {
            try {
                const savedData = localStorage.getItem(STORAGE_KEY);
                if (savedData) {
                    const state = JSON.parse(savedData);
                    if (Array.isArray(state.userAnswers) && state.userAnswers.length === surgeryQuestionsRaw.length) {
                        userAnswers = state.userAnswers;
                        if (typeof state.currentIndex === 'number') currentIndex = state.currentIndex;
                        if (state.selectedFilter) sourceFilter.value = state.selectedFilter;
                        flashSaveStatus("Progress Restored");
                        return true;
                    }
                }
            } catch (e) {
                console.error("Failed to load auto-save state", e);
            }
            return false;
        }

        function flashSaveStatus(msg) {
            saveStatusText.textContent = msg;
            setTimeout(() => {
                saveStatusText.textContent = "Auto-Save Enabled";
            }, 2000);
        }

        function clearSavedProgress() {
            if (confirm("Are you sure you want to reset all your progress? This cannot be undone.")) {
                localStorage.removeItem(STORAGE_KEY);
                userAnswers = new Array(surgeryQuestionsRaw.length).fill(null);
                currentIndex = 0;
                sourceFilter.value = "ALL";
                filterQuestions();
                flashSaveStatus("Progress Reset");
            }
        }

        // --- FILTER & NAVIGATION ---
        function filterQuestions() {
            const filterVal = sourceFilter.value;
            if (filterVal === "ALL") {
                currentQuestions = surgeryQuestionsRaw.map((q, idx) => ({ ...q, originalIndex: idx }));
            } else {
                currentQuestions = surgeryQuestionsRaw
                    .map((q, idx) => ({ ...q, originalIndex: idx }))
                    .filter(q => q.source === filterVal);
            }
            currentIndex = 0;
            renderQuiz();
        }

        // --- RENDER FUNCTION ---
        function renderQuiz() {
            if (currentQuestions.length === 0) return;

            const qData = currentQuestions[currentIndex];
            const originalIndex = qData.originalIndex;
            const savedAnswer = userAnswers[originalIndex];

            // Update Badges & Headers
            questionNumberBadge.textContent = `Question ${currentIndex + 1} of ${currentQuestions.length}`;
            sourceBadge.textContent = qData.source;
            questionText.textContent = qData.q;

            // Render Options
            optionsContainer.innerHTML = '';
            qData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100 option-btn font-medium text-sm flex items-start space-x-3";
                
                const letter = String.fromCharCode(65 + idx);
                btn.innerHTML = `<span class="font-bold text-slate-500">${letter}.</span><span class="flex-grow">${opt}</span>`;

                if (savedAnswer !== null) {
                    btn.disabled = true;
                    if (idx === qData.correct) {
                        btn.classList.add(savedAnswer === qData.correct ? 'correct-selected' : 'correct-unselected');
                    } else if (idx === savedAnswer) {
                        btn.classList.add('wrong-selected');
                    }
                } else {
                    btn.onclick = () => handleOptionSelect(originalIndex, idx);
                }

                optionsContainer.appendChild(btn);
            });

            // Handle Explanation Box
            if (savedAnswer !== null) {
                explanationBox.classList.remove('hidden');
                explanationText.textContent = qData.exp;
            } else {
                explanationBox.classList.add('hidden');
            }

            // Controls
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === currentQuestions.length - 1;

            updateGridNavigator();
            updateCounters();
        }

        function handleOptionSelect(origIdx, selectedOptIdx) {
            userAnswers[origIdx] = selectedOptIdx;
            saveProgressToLocalStorage();
            renderQuiz();
        }

        function updateGridNavigator() {
            questionGrid.innerHTML = '';
            currentQuestions.forEach((q, idx) => {
                const origIdx = q.originalIndex;
                const ans = userAnswers[origIdx];
                const btn = document.createElement('button');
                btn.className = "p-2 text-xs font-bold rounded border transition text-center flex items-center justify-center";

                if (idx === currentIndex) {
                    btn.classList.add('ring-2', 'ring-indigo-600', 'ring-offset-1');
                }

                if (ans === null) {
                    btn.classList.add('bg-slate-100', 'text-slate-700', 'border-slate-300', 'hover:bg-slate-200');
                } else if (ans === q.correct) {
                    btn.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600');
                } else {
                    btn.classList.add('bg-rose-500', 'text-white', 'border-rose-600');
                }

                btn.textContent = idx + 1;
                btn.onclick = () => {
                    currentIndex = idx;
                    renderQuiz();
                    saveProgressToLocalStorage();
                };
                questionGrid.appendChild(btn);
            });
        }

        function updateCounters() {
            let totalAnswered = 0;
            let correctCount = 0;

            userAnswers.forEach((ans, idx) => {
                if (ans !== null) {
                    totalAnswered++;
                    if (ans === surgeryQuestionsRaw[idx].correct) {
                        correctCount++;
                    }
                }
            });

            scoreCounter.textContent = `${correctCount} / ${totalAnswered}`;
            progressCounter.textContent = `${totalAnswered} / ${surgeryQuestionsRaw.length}`;
        }

        // --- EVENT LISTENERS ---
        prevBtn.onclick = () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuiz();
                saveProgressToLocalStorage();
            }
        };

        nextBtn.onclick = () => {
            if (currentIndex < currentQuestions.length - 1) {
                currentIndex++;
                renderQuiz();
                saveProgressToLocalStorage();
            }
        };

        sourceFilter.onchange = () => {
            filterQuestions();
            saveProgressToLocalStorage();
        };

        resetQuizBtn.onclick = clearSavedProgress;

        // --- INITIALIZATION ---
        window.onload = () => {
            const hasRestored = loadProgressFromLocalStorage();
            filterQuestions();
            if (!hasRestored) {
                saveProgressToLocalStorage();
            }
        };
    </script>
