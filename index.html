        const gridContainer = document.getElementById('question-grid');

        function renderGrid() {
            gridContainer.innerHTML = '';
            currentQuestions.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.innerText = idx + 1;
                btn.className = `p-1.5 text-xs font-semibold rounded border ${
                    idx === currentIndex ? 'ring-2 ring-indigo-600 font-bold' : ''
                } ${
                    q.userAnswer === undefined 
                        ? 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100' 
                        : q.userAnswer === q.correct 
                            ? 'bg-green-500 border-green-600 text-white' 
                            : 'bg-red-500 border-red-600 text-white'
                }`;
                btn.onclick = () => {
                    currentIndex = idx;
                    loadQuestion();
                };
                gridContainer.appendChild(btn);
            });
        }

        function loadQuestion() {
            if (currentQuestions.length === 0) return;
            const q = currentQuestions[currentIndex];

            qBadge.innerText = `Question ${currentIndex + 1} of ${currentQuestions.length}`;
            srcBadge.innerText = q.source;
            qText.innerText = q.q;

            optContainer.innerHTML = '';

            q.options.forEach((optStr, optIdx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-3.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100 text-sm font-medium flex items-start space-x-3`;
                
                const letter = String.fromCharCode(65 + optIdx);
                btn.innerHTML = `<span class="font-bold text-indigo-600 flex-shrink-0">${letter}.</span><span class="flex-grow">${optStr}</span>`;

                if (q.userAnswer !== undefined) {
                    btn.disabled = true;
                    if (optIdx === q.correct) {
                        btn.classList.add(q.userAnswer === q.correct ? 'correct-selected' : 'correct-unselected');
                    } else if (optIdx === q.userAnswer) {
                        btn.classList.add('wrong-selected');
                    }
                } else {
                    btn.onclick = () => selectOption(optIdx);
                }

                optContainer.appendChild(btn);
            });

            if (q.userAnswer !== undefined) {
                expText.innerText = q.exp;
                expBox.classList.remove('hidden');
            } else {
                expBox.classList.add('hidden');
            }

            prevBtn.disabled = currentIndex === 0;
            nextBtn.innerText = currentIndex === currentQuestions.length - 1 ? 'Finish Section' : 'Next Question';

            renderGrid();
        }

        function selectOption(index) {
            const q = currentQuestions[currentIndex];
            if (q.userAnswer !== undefined) return;

            q.userAnswer = index;
            if (index === q.correct) {
                score++;
            }
            answeredCount++;

            scoreCounter.innerText = `${score} / ${answeredCount}`;
            progressCounter.innerText = `${answeredCount} / ${surgeryQuestionsRaw.length}`;

            loadQuestion();
        }

        prevBtn.onclick = () => {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        };

        nextBtn.onclick = () => {
            if (currentIndex < currentQuestions.length - 1) {
                currentIndex++;
                loadQuestion();
            }
        };

        sourceFilter.onchange = (e) => {
            const filter = e.target.value;
            if (filter === 'ALL') {
                currentQuestions = [...surgeryQuestionsRaw];
            } else {
                currentQuestions = surgeryQuestionsRaw.filter(q => q.source === filter);
            }
            currentIndex = 0;
            loadQuestion();
        };

        // Init
        loadQuestion();
    </script>
</body>
</html>
